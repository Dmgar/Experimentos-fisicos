[project]
name = "physlab-backend"
version = "1.0.0"
description = "Project Fénix - High-performance computational physics and experiment perception backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.9.0",
    "numpy>=1.26.0",
    "scipy>=1.14.0",
    "pandas>=2.2.0",
    "opencv-python-headless>=4.10.0",
    "matplotlib>=3.9.0",
    "pytest>=8.3.0",
    "httpx>=0.27.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
